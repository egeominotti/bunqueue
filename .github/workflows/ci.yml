name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rebuild_docker:
        description: 'Rebuild and publish Docker variants for the current version (main only)'
        type: boolean
        default: false
      npm_version:
        description: 'Exact root bunqueue version to publish to npm (blank disables publishing)'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep local sandbox, CI, and release builds reproducible.
  BUN_VERSION: '1.4.2'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Code Quality
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Oxlint and Oxfmt check
        run: bun run check:oxc

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run type check
        run: bun run typecheck

  # ============================================
  # Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build portable client artifacts for parity tests
        run: bun run build:client

      - name: Run unit tests
        run: bun test --parallel=4

  test-postgres:
    name: PostgreSQL ${{ matrix.postgres.label }} Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - label: '18.6'
            image: 'postgres:18.6-alpine'
            expected: '18.6'
          - label: '17.x'
            image: 'postgres:17-alpine'
            expected: '17'
          - label: '16.x'
            image: 'postgres:16-alpine'
            expected: '16'
          - label: '15.x'
            image: 'postgres:15-alpine'
            expected: '15'
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: bunqueue
          POSTGRES_PASSWORD: bunqueue
          POSTGRES_USER: bunqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunqueue -d bunqueue"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      BUNQUEUE_TEST_POSTGRES_URL: postgresql://bunqueue:bunqueue@127.0.0.1:5432/bunqueue
      BUNQUEUE_TEST_POSTGRES_VERSION_PREFIX: ${{ matrix.postgres.expected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run PostgreSQL integration and four-process topology tests
        run: bun run test:postgres

  test-tcp:
    name: TCP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run TCP integration tests
        run: bun scripts/tcp/run-all-tests.ts

  test-embedded:
    name: Embedded Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run embedded integration tests
        run: bun scripts/embedded/run-all-tests.ts

  test-core-e2e:
    name: Core Public API E2E (Embedded + TCP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Exercise every core public method against SQLite and a real TCP broker
        run: bun run test:core-e2e

      - name: Upload the method-by-method public API matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-public-api-e2e-matrix
          path: artifacts/core-e2e/
          if-no-files-found: error
          retention-days: 30

  # ============================================
  # Docs site: the bunqueue.dev build must stay green
  # ============================================
  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history: the sitemap derives real per-page lastmod from git log
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Runs before the build: both failures it catches are invisible locally
      # (an ignored import resolves on the author's disk; a stale generated
      # version list still builds) and its error names the fix directly.
      - name: Check committed docs data
        run: bun scripts/check-docs-data.ts

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build docs site
        working-directory: docs
        run: bun run build

      - name: Sanity-check output
        working-directory: docs
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/rss.xml
          # @astrojs/sitemap emits a single minified line, so `grep -c` (which
          # counts matching LINES) would report 1. Count <loc> OCCURRENCES.
          URLS=$(grep -o "<loc>" dist/sitemap-0.xml | wc -l | tr -d '[:space:]')
          echo "sitemap URLs: $URLS"
          test "$URLS" -ge 60

  test-websocket:
    name: WebSocket/SSE Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run WebSocket/SSE integration tests
        run: bun scripts/websocket/run-all-tests.ts

  # Every release-capable CI run executes the same six-language SDK workflow.
  # Keeping this in the release graph avoids the race where the independent SDK
  # workflow reports a failure only after artifacts have already been published.
  sdk:
    name: Official SDKs
    uses: ./.github/workflows/sdk.yml
    with:
      run_soak: false

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        test,
        test-postgres,
        test-tcp,
        test-embedded,
        test-core-e2e,
        test-websocket,
        docs,
        sdk,
      ]
    if: ${{ always() }}
    steps:
      - name: Require every test and SDK job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          TCP_RESULT: ${{ needs.test-tcp.result }}
          EMBEDDED_RESULT: ${{ needs.test-embedded.result }}
          CORE_E2E_RESULT: ${{ needs.test-core-e2e.result }}
          WEBSOCKET_RESULT: ${{ needs.test-websocket.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          set -euo pipefail
          for result in \
            "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$POSTGRES_RESULT" \
            "$TCP_RESULT" "$EMBEDDED_RESULT" "$CORE_E2E_RESULT" "$WEBSOCKET_RESULT" \
            "$DOCS_RESULT" "$SDK_RESULT"; do
            test "$result" = success
          done

  # ============================================
  # Version gate — only build binaries / cut a release when package.json
  # version is NEW (avoids rebuilding 8×~90MB binaries + a fresh release on
  # every docs/chore commit to main, which never bumps the version).
  # It also fixes the exact source commit of every published artifact:
  # the pushed commit for a new version, or the existing release tag's commit
  # for a manual Docker rebuild / npm publication of an already tagged version.
  # Every build, test, package, and publish job checks out `source_sha`.
  # ============================================
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: >-
      needs.quality-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.gate.outputs.version }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      should_release: ${{ steps.gate.outputs.should_release }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Decide whether this version is already released
        id: gate
        env:
          REBUILD_DOCKER: ${{ inputs.rebuild_docker == true || inputs.npm_version != '' }}
          REQUESTED_NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "${REQUESTED_NPM_VERSION:-}" && "$REQUESTED_NPM_VERSION" != "$VERSION" ]]; then
            echo "::error::Requested npm version does not match package.json"
            exit 1
          fi
          TAG="v$VERSION"
          if TAG_REFS=$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}"); then
            # Rebuild/republish an existing release only from its tagged commit.
            # Annotated tags list a peeled `^{}` line naming the commit; a
            # lightweight tag names the commit directly.
            SOURCE_SHA=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<< "$TAG_REFS")
            if [[ -z "$SOURCE_SHA" ]]; then
              SOURCE_SHA=$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<< "$TAG_REFS")
            fi
            if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Unable to resolve the commit of release tag $TAG"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
            TAG_VERSION=$(git show "$SOURCE_SHA:package.json" |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Release tag $TAG points to $SOURCE_SHA, whose package.json version is $TAG_VERSION"
              exit 1
            fi
            SHOULD_RELEASE=false
            SHOULD_BUILD=$REBUILD_DOCKER
            echo "::notice::$TAG already released at $SOURCE_SHA; rebuild requested: $REBUILD_DOCKER"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to check release tag (git exited $status)"
              exit "$status"
            fi
            SOURCE_SHA=$GITHUB_SHA
            SHOULD_RELEASE=true
            SHOULD_BUILD=true
            echo "::notice::$TAG is new — building binaries and cutting a release from $SOURCE_SHA."
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source is not a full commit SHA: $SOURCE_SHA"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "should_release=$SHOULD_RELEASE"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

  # ============================================
  # Build Binaries (only on a new version)
  # ============================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [version-gate]
    if: needs.version-gate.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: bunqueue-linux-x64
          - target: bun-linux-arm64
            artifact: bunqueue-linux-arm64
          - target: bun-linux-x64-musl
            artifact: bunqueue-linux-x64-musl
          - target: bun-linux-arm64-musl
            artifact: bunqueue-linux-arm64-musl
          - target: bun-darwin-x64
            artifact: bunqueue-darwin-x64
          - target: bun-darwin-arm64
            artifact: bunqueue-darwin-arm64
          - target: bun-windows-x64
            artifact: bunqueue-windows-x64.exe
          - target: bun-windows-arm64
            artifact: bunqueue-windows-arm64.exe
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version-gate.outputs.source_sha }}

      # An empty ref would silently fall back to the triggering commit.
      - name: Verify the release source commit and version
        id: version
        env:
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$EXPECTED_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build executable
        run: bun build --compile --minify --target=${{ matrix.target }} src/main.ts --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ============================================
  # Test each production image on native architecture before any publication.
  # ============================================
  docker-test:
    name: Docker test (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [version-gate, build]
    if: needs.version-gate.outputs.should_build == 'true' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian, slim, distroless]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version-gate.outputs.source_sha }}
      # A rebuild of an older tag uses this workflow with that tag's tree. A tree
      # without the variant Dockerfile would ignore VARIANT and publish one image
      # under four variant names, so it must stop here instead.
      - name: Require variant-aware image build inputs in the release source
        env:
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          if ! grep -Eq '^ARG VARIANT=' Dockerfile ||
            ! grep -Eq '^FROM [$][{]VARIANT[}]-base ' Dockerfile ||
            [ ! -f scripts/test-docker-image.ts ]; then
            echo "::error::Release source $SOURCE_SHA predates the Docker variant build inputs this workflow requires"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build native candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VARIANT=${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version-gate.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.version-gate.outputs.version }}
          load: true
          tags: bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Verify release provenance labels
        env:
          IMAGE: bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")
          test "$revision" = "$SOURCE_SHA"
          test "$version" = "$VERSION"
      - name: Validate health, authentication, persistence, and cleanup
        run: bun scripts/test-docker-image.ts bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }}
      - name: Preserve image validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-evidence-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/docker-images/
          retention-days: 7
      - name: Export tested image
        run: docker save bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }} -o /tmp/image-${{ matrix.arch }}.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 1

  docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker-test]
    if: >-
      needs.version-gate.outputs.should_build == 'true' &&
      needs.build.result == 'success' && needs.docker-test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian, slim, distroless]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version-gate.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docker-${{ matrix.variant }}-*
          path: /tmp/docker-images
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/egeominotti/bunqueue
          tags: |
            type=raw,value=${{ needs.version-gate.outputs.version }},enable=${{ matrix.variant == 'alpine' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'alpine' }}
            type=raw,value=${{ needs.version-gate.outputs.version }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}

      - name: Publish the tested images and multi-platform tags
        env:
          VARIANT: ${{ matrix.variant }}
          TAGS: ${{ steps.meta.outputs.tags }}
          # Staging tags name the commit the images were built from, which is
          # the release tag's commit on a rebuild, not the dispatching commit.
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "/tmp/docker-images/image-$arch.tar"
          done
          registry="$REGISTRY/$IMAGE_NAME"
          image_index="$registry:$SOURCE_SHA-$VARIANT"
          ghcr_tags=(--tag "$image_index")
          hub_tags=()
          while IFS= read -r tag; do
            if [[ "$tag" == "$registry:"* ]]; then
              ghcr_tags+=(--tag "$tag")
            elif [[ "$tag" == docker.io/egeominotti/bunqueue:* ]]; then
              hub_tags+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          test "${#ghcr_tags[@]}" -gt 2
          test "${#hub_tags[@]}" -gt 0
          refs=()
          for arch in amd64 arm64; do
            ref="$registry:$SOURCE_SHA-$VARIANT-$arch"
            docker tag "bunqueue-candidate:$VARIANT-$arch" "$ref"
            docker push "$ref"
            refs+=("$ref")
          done
          docker buildx imagetools create "${ghcr_tags[@]}" "${refs[@]}"
          docker buildx imagetools create "${hub_tags[@]}" "$image_index"

  # ============================================
  # Root npm package: explicit version request, after all product/image gates.
  # ============================================
  # npm publication is split in two jobs so that the OIDC publish credential is
  # never available to code that installs dependencies or runs tests:
  # `npm-pack` builds, verifies and packs without any credential, and `npm`
  # only downloads that tarball and publishes it through npm trusted publishing.
  npm-pack:
    name: Pack bunqueue for npm
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.npm_version != '' &&
      github.ref == 'refs/heads/main' && needs.build.result == 'success' &&
      needs.docker.result == 'success'
    permissions:
      contents: read
    env:
      REQUESTED_VERSION: ${{ inputs.npm_version }}
      SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version-gate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify the explicitly requested unpublished version
        run: |
          set -euo pipefail
          test "$REQUESTED_VERSION" = "$(bun -p "require('./package.json').version")"
          # npm provenance records the triggering commit (GITHUB_SHA). Publishing
          # contents from a different commit would produce a misleading
          # attestation, so publication runs only while main still points at
          # the release commit; once main has moved on, bump the version.
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Version $REQUESTED_VERSION is tagged at $SOURCE_SHA, but main is now at $GITHUB_SHA. npm provenance would name the wrong commit: bump the version and publish the new release instead."
            exit 1
          fi
          bun -e '
            const response = await fetch("https://registry.npmjs.org/bunqueue/" + encodeURIComponent(process.env.REQUESTED_VERSION));
            if (response.status !== 404) throw new Error("Publication blocked: registry returned " + response.status);
          '
      - name: Build and verify the package consumer contract
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test test/package-consumer-smoke.test.ts
          mkdir -p /tmp/npm-package
          bun pm pack --ignore-scripts --destination /tmp/npm-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-bunqueue-${{ inputs.npm_version }}
          path: /tmp/npm-package/bunqueue-${{ inputs.npm_version }}.tgz
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish bunqueue to npm
    runs-on: ubuntu-latest
    needs: [version-gate, npm-pack]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.npm_version != '' &&
      github.ref == 'refs/heads/main' && needs.npm-pack.result == 'success'
    # npm trusted publishing (trusted publisher: ci.yml, environment `npm`): npm
    # exchanges the GitHub OIDC token for a short-lived publish credential, so no
    # long-lived npm token exists, and attaches a signed provenance attestation.
    # This job checks out no code and installs no dependencies.
    environment: npm
    permissions:
      id-token: write
    env:
      REQUESTED_VERSION: ${{ inputs.npm_version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-bunqueue-${{ inputs.npm_version }}
          path: /tmp/npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Bun's publisher has no OIDC support.
      - name: Install the npm CLI used for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          node -e '
            const [major, minor, patch] = process.argv[1].trim().split(".").map(Number);
            if (major * 1e6 + minor * 1e3 + patch < 11005001) throw new Error("npm " + process.argv[1] + " cannot use trusted publishing");
          ' "$(npm --version)"
      - name: Publication dry run
        run: npm publish --dry-run --ignore-scripts --access public "/tmp/npm-package/bunqueue-$REQUESTED_VERSION.tgz"
      # Publishes the exact tarball Bun packed and the smoke test verified.
      - name: Publish the verified tarball with provenance
        run: npm publish --ignore-scripts --access public --provenance "/tmp/npm-package/bunqueue-$REQUESTED_VERSION.tgz"

  # ============================================
  # Create Release (only on main)
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker]
    # Explicit gate (not just implicit success() propagation from build/docker):
    # only cut a release for a NEW version.
    if: >-
      needs.version-gate.outputs.should_release == 'true' &&
      needs.build.result == 'success' &&
      needs.docker.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version-gate.outputs.source_sha }}

      - name: Resolve version
        id: version
        run: echo "version=${{ needs.version-gate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          pattern: bunqueue-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          ls -la artifacts/

          # Collect binaries (artifacts may be nested one level depending on the
          # upload-artifact version), keeping the canonical names.
          for name in bunqueue-linux-x64 bunqueue-linux-arm64 bunqueue-linux-x64-musl bunqueue-linux-arm64-musl bunqueue-darwin-x64 bunqueue-darwin-arm64 bunqueue-windows-x64.exe bunqueue-windows-arm64.exe; do
            cp "artifacts/$name" release/ 2>/dev/null || cp "artifacts/$name/$name" release/
          done

          # Compress each binary before upload: a Bun --compile binary embeds the
          # whole runtime (~60–94MB) but compresses ~55–65%, so the DOWNLOAD drops
          # to ~30–40MB. Unix → .tar.gz (preserves the +x bit), Windows → .zip.
          cd release
          for name in bunqueue-linux-x64 bunqueue-linux-arm64 bunqueue-linux-x64-musl bunqueue-linux-arm64-musl bunqueue-darwin-x64 bunqueue-darwin-arm64; do
            chmod +x "$name"
            tar -czf "$name.tar.gz" "$name"
            rm "$name"
          done
          for name in bunqueue-windows-x64 bunqueue-windows-arm64; do
            zip -9 "$name.zip" "$name.exe"
            rm "$name.exe"
          done

          # Checksums of the published (compressed) artifacts.
          sha256sum bunqueue-* > SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # Without this, GitHub creates the new tag at the default branch's
          # HEAD when the release finishes, which moves if main advanced during
          # the pipeline. The tag must name the commit the assets were built from.
          target_commitish: ${{ needs.version-gate.outputs.source_sha }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/bunqueue-linux-x64.tar.gz
            release/bunqueue-linux-arm64.tar.gz
            release/bunqueue-linux-x64-musl.tar.gz
            release/bunqueue-linux-arm64-musl.tar.gz
            release/bunqueue-darwin-x64.tar.gz
            release/bunqueue-darwin-arm64.tar.gz
            release/bunqueue-windows-x64.zip
            release/bunqueue-windows-arm64.zip
            release/SHA256SUMS
          body: |
            ## Installation

            ### Docker (recommended)

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker run -p 6789:6789 -p 6790:6790 ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            The immutable version tag and `latest` point to the same multi-arch image.

            ### Binary

            Compressed downloads (~30–40MB; extract to get the standalone
            executable, which embeds the Bun runtime). Verify with `SHA256SUMS`.

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux | x64 | `bunqueue-linux-x64.tar.gz` |
            | Linux | arm64 | `bunqueue-linux-arm64.tar.gz` |
            | Linux (musl / Alpine) | x64 | `bunqueue-linux-x64-musl.tar.gz` |
            | Linux (musl / Alpine) | arm64 | `bunqueue-linux-arm64-musl.tar.gz` |
            | macOS | x64 (Intel) | `bunqueue-darwin-x64.tar.gz` |
            | macOS | arm64 (Apple Silicon) | `bunqueue-darwin-arm64.tar.gz` |
            | Windows | x64 | `bunqueue-windows-x64.zip` |
            | Windows | arm64 | `bunqueue-windows-arm64.zip` |

            ```bash
            # Example: Linux x64
            tar -xzf bunqueue-linux-x64.tar.gz
            chmod +x bunqueue-linux-x64
            ./bunqueue-linux-x64
            ```
