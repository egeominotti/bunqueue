name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  # Only a human push cancels a running review; a bot push (whose job is skipped) waits.
  cancel-in-progress: ${{ github.event.sender.type != 'Bot' }}

jobs:
  claude-review:
    # Fork pull requests do not receive secrets, so only same-repository PRs are reviewed;
    # drafts are reviewed once they are marked ready; bot-authored events (Dependabot, the
    # Claude app's own pushes) are skipped because the action refuses non-human actors.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Repository rules for this review: follow CLAUDE.md.
            Never suggest adding, editing or deleting tests: the existing test suite is the
            behavioral contract and must stay unchanged. Focus on correctness: bugs, race
            conditions, error handling, resource and memory bounds, and any change of
            observable behavior, API, events or results. Do not comment on style or
            formatting. Write review comments in English."
