name: SDK Security

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: sdk-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Weekly SDK dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
      # A SHA pin cannot select the toolchain by branch name; pass it explicitly.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.1'
          otp-version: '28.0'
      - name: TypeScript advisory audit
        working-directory: sdk/typescript
        run: |
          bun install --frozen-lockfile
          bun audit
      - name: Python advisory audit
        run: |
          python -m venv /tmp/python-audit
          /tmp/python-audit/bin/pip install --quiet ./sdk/python pip-audit
          /tmp/python-audit/bin/pip-audit --local
      - name: PHP advisory audit
        working-directory: sdk/php
        run: |
          composer install --no-interaction --no-progress
          composer audit --locked
      - name: Go vulnerability analysis
        working-directory: sdk/go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Rust advisory audit
        working-directory: sdk/rust
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Elixir retired-package audit
        working-directory: sdk/elixir
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.audit
