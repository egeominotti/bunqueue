name: SDK Release (npm)

# A package release is requested manually. The version is validated before
# publishing and the immutable tag is created only after npm accepts the package.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact sdk/typescript package version to publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sdk:
    name: Validate every official SDK
    uses: ./.github/workflows/sdk.yml
    with:
      run_soak: false

  publish:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: [sdk]
    # `contents: write` pushes the release tag. No OIDC `id-token` is granted
    # because no step exchanges one; the npm token authenticates publication.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install canonical build dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install and package reproducibly
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          mkdir -p /tmp/typescript-package
          bun pm pack --destination /tmp/typescript-package
      - name: Validate requested version and tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./sdk/typescript/package.json').version")
          test "$REQUESTED_VERSION" = "$VERSION"
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*) echo "Invalid SDK version: $VERSION" >&2; exit 1 ;;
          esac
          TAG="sdk-ts-v$VERSION"
          # Only Git's exit status 2 means the tag is absent; a network or
          # authentication failure must not be mistaken for "not yet tagged".
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to check tag $TAG (git exited $status)"
              exit "$status"
            fi
          fi
          # Only an explicit 404 means the version is unpublished.
          bun -e '
            const response = await fetch("https://registry.npmjs.org/bunqueue-client/" + encodeURIComponent(process.env.REQUESTED_VERSION));
            if (response.status !== 404) throw new Error("Publication blocked: registry returned " + response.status);
          '
          echo "SDK_VERSION=$VERSION" >> "$GITHUB_ENV"
      # The pinned Bun CLI reads the registry token only from NPM_CONFIG_TOKEN,
      # not from the setup-node .npmrc; expose it only to the two steps below.
      - name: Verify npm authentication and publication dry run
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          bun pm whoami
          bun publish --dry-run "/tmp/typescript-package/bunqueue-client-$SDK_VERSION.tgz"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-bunqueue-client-${{ inputs.version }}
          path: /tmp/typescript-package/*.tgz
          retention-days: 7
      - name: Publish the verified tarball
        working-directory: sdk/typescript
        run: bun publish --access public "/tmp/typescript-package/bunqueue-client-$SDK_VERSION.tgz"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the published commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "sdk-ts-v$SDK_VERSION" -m "TypeScript SDK v$SDK_VERSION"
          git push origin "sdk-ts-v$SDK_VERSION"
