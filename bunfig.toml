[test]
preload = ["./test/preload.ts"]
# artifacts/ (gitignored) holds full copies of older source trees, test files
# included. The glob is anchored at the repository root, so a directory named
# artifacts anywhere else is still discovered.
pathIgnorePatterns = ["artifacts/**"]

[fmt]
# Formatting options for `bun fmt`, applied on top of Prettier's defaults.
useTabs = false
tabWidth = 2
printWidth = 100
singleQuote = true
jsxSingleQuote = false
quoteProps = "as-needed"
trailingComma = "es5"
semi = true
arrowParens = "always"
bracketSameLine = false
bracketSpacing = true
singleAttributePerLine = false
ignorePatterns = [
  "dist/**",
  "node_modules/**",
  "**/*.db",
  "**/*.db-wal",
  "**/*.db-shm",
  "coverage/**",
  "bun.lock",
  "bun.lockb",
]
